AWSTemplateFormatVersion: '2010-09-09'
Description: Bucket S3 privado para demonstrar AWS CloudFormation

Resources:
  LabBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

Outputs:
  BucketName:
    Description: Nome do bucket S3 criado pela stack
    Value: !Ref LabBucket
